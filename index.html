<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TANKWARS</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; background: #12070c;
        overflow: hidden; font-family: monospace;
        /* Fingers drive the canvas: no pinch zoom, double-tap zoom, or pull to refresh. */
        touch-action: none; -webkit-user-select: none; user-select: none;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100vw; height: 100vh; }
      canvas { image-rendering: pixelated; display: block; touch-action: none; }
      /* Shown by main.ts on a touch device held in portrait. */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #12070c; color: #f0d9a8;
        flex-direction: column; align-items: center; justify-content: center;
        text-align: center; font-size: 22px; letter-spacing: 0.1em; padding: 24px;
      }
      #rotate span { font-size: 64px; margin-bottom: 16px; }
      /* Fullscreen in and out, from any screen. Shown by main.ts where the browser can do it. */
      #fs {
        display: none; position: fixed; z-index: 20;
        top: calc(env(safe-area-inset-top, 0px) + 6px);
        right: calc(env(safe-area-inset-right, 0px) + 6px);
        width: 44px; height: 44px; padding: 0; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(240, 217, 168, 0.55); background: rgba(18, 7, 12, 0.72); color: #f0d9a8;
        font: 22px/42px monospace; text-align: center; touch-action: manipulation;
      }
      #fs:active { background: rgba(240, 217, 168, 0.25); }
    </style>
  </head>
  <body>
    <!-- The overlays sit inside #game, which is the fullscreen element: anything
         outside it disappears while fullscreen, and that once hid the way out. -->
    <div id="game">
      <div id="rotate"><span>⟲</span>TURN YOUR DEVICE<br /><small>TANKWARS plays in landscape</small></div>
      <button id="fs" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
